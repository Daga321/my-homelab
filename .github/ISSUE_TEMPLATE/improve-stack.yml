name: "🔧 Improve Stack"
description: Propose improvements or extensions to an existing homelab stack.
title: "[🔧 Improve Stack]: "
labels:
  - type:stack
  - kind:improvement
body:
  - type: input
    id: existing_stack
    attributes:
      label: Existing stack
      placeholder: e.g., immich, paperless-ngx, observability
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - docker
        - network
        - storage
        - automation
        - documentation
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - low
        - medium
        - high
        - critical
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior or limitation
    validations:
      required: true

  - type: textarea
    id: proposed_improvement
    attributes:
      label: Proposed improvement
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why should this be prioritized now?
    validations:
      required: true

  - type: textarea
    id: expected_impact
    attributes:
      label: Expected impact
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
    validations:
      required: false
