name: "🔄 Improve Workflow"
description: Propose a focused improvement to an existing automation or operational workflow.
title: "[🔄 Improve Workflow]: "
labels:
  - type:workflow
  - kind:improvement
body:
  - type: input
    id: existing_workflow
    attributes:
      label: Existing workflow
      placeholder: e.g., sync-labels, deployment pipeline, backup verification
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Workflow improvements are classified under automation.
      options:
        - automation
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - low
        - medium
        - high
        - critical
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior or limitation
    validations:
      required: true

  - type: textarea
    id: proposed_improvement
    attributes:
      label: Proposed improvement
      description: Describe the specific change without expanding into unrelated work.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Explain the problem, operational cost, or risk this addresses.
    validations:
      required: true

  - type: textarea
    id: expected_impact
    attributes:
      label: Expected impact
      description: Describe expected reliability, security, maintenance, or usability effects.
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration considerations
      description: Note affected users, existing runs, data, secrets, or rollback requirements.
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
    validations:
      required: false
