name: "🐛 Bug Report"
description: Report unexpected behavior or failures in stacks, services, containers, network, storage, automation, or docs.
title: "[🐛 Bug]: "
labels:
  - type:bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form to report a reproducible problem in existing homelab components.

  - type: input
    id: affected_stack
    attributes:
      label: Affected stack or component
      placeholder: e.g., immich stack, traefik, samba container, docs CI
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - docker
        - network
        - storage
        - automation
        - documentation
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - low
        - medium
        - high
        - critical
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g., Debian 12, Docker 27, Raspberry Pi 5, Proxmox VE 8
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the issue clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: Provide exact steps so others can reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or evidence
      description: Paste logs, screenshots, traces, or command output.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any extra context that might help triage.
    validations:
      required: false
