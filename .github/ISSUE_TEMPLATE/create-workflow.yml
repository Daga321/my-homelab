name: "⚙️ Create Workflow"
description: Propose a new automation or operational workflow with a defined first version.
title: "[⚙️ Create Workflow]: "
labels:
  - type:workflow
  - kind:new
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a completely new workflow.
        Keep the first version bounded; future enhancements should be separate Improve Workflow issues.

  - type: input
    id: workflow_name
    attributes:
      label: Proposed workflow name
      placeholder: e.g., label synchronization, backup verification, deployment promotion
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: New workflows are classified under automation.
      options:
        - automation
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - low
        - medium
        - high
        - critical
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem being solved
      description: What recurring task, risk, or gap does this workflow address?
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Define the outcome the initial workflow must achieve.
    validations:
      required: true

  - type: textarea
    id: trigger
    attributes:
      label: Trigger and inputs
      description: Explain what starts the workflow and what information it needs.
    validations:
      required: true

  - type: textarea
    id: outputs
    attributes:
      label: Expected outputs
      description: Describe changes, notifications, artifacts, or other results.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and permissions
      description: List systems, secrets, tools, APIs, and permissions required.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Initial scope
      description: Define what is included and explicitly excluded from the first version.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: textarea
    id: documentation_requirements
    attributes:
      label: Documentation requirements
      description: List required setup, operation, troubleshooting, and rollback documentation.
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
    validations:
      required: false
